[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-product-data-sp"
dynamic = ["version"]
description = "Reliable and public source of insurance market data for Spain with automated collection and manual curation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache 2.0"}
authors = [
    {name = "weisseorchid", email = "weisseorchid@gmail.com"}
]
keywords = ["insurance", "spain", "data", "regulatory", "dgsfp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.32.5",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0", # For data validation
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/weisseorchid/insurance-product-data-SP"
Documentation = "https://insurance-product-data-sp.readthedocs.io"
Repository = "https://github.com/weisseorchid/insurance-product-data-SP"
Issues = "https://github.com/weisseorchid/insurance-product-data-SP/issues"

[tool.hatch.version]
path = "src/insurance_data_spain/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_data_spain"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 120
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
lint.ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
